[project]

name = "test-py-modern"
version = "0.0.1"
description = "A project to test the py-modern template"
authors = [{ name = "sandyowlet", email = "sandyowlet@gmail.com" }]

requires-python = ">=3.12"
dependencies = []

readme = "README.md"
license-files = ["LICENSE"]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]

Homepage = "https://sandyowlet.github.io/test-py-modern/"
Repository = "https://github.com/sandyowlet/test-py-modern"
Documentation = "https://sandyowlet.github.io/test-py-modern/"

[tool.setuptools.packages.find]
where = ["src"]

# The development dependencies
[dependency-groups]
dev = [

    {include-group = "check"},
    {include-group = "test"},
    "pre-commit>=2.20.0",
]

test = [
    "pytest>=7.2.0",
]

check = [
    "ruff>=0.14.3",
    "pyright>=1.1.345",
]

doc = [
    "mkdocs>=1.4.2",
    "mkdocs-material>=8.5.10",
    "mkdocstrings[python]>=0.26.1",
    "mkdocs-include-markdown-plugin>=7.1.5",
]

[tool.uv]
default-groups = ["dev", "test", "check"]

[build-system]
requires = ["wheel", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture sys --verbose"

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
src = ["src", "tests"]

[tool.ruff.lint]
# Ruff version: 0.14.3
select = [
    "AIR",
    # "ANN", # Enable this to enforce type annotations
    "FAST",
    "YTT",
    "ASYNC",
    "S",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "T10",
    "DJ",
    "EXE",
    "FA",
    "INT",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RSE",
    "RET",
    "SIM",
    "SLOT",
    "TID252",
    "TC",
    "ARG",
    "PTH",
    "I",
    "NPY",
    "PD",
    "E",
    "W",
    "DOC102",
    "DOC202",
    "DOC403",
    "D",
    "F",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "UP",
    "FURB",
    "RUF",
    "TRY",
]
ignore = [
    "G004",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM114",
    "SIM117",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D401",
    "PLW0602",
    "PLW0603",
    "TRY002",
    "TRY003",
]

fixable = ["ALL"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
skip-magic-trailing-comma = false
docstring-code-format = true


